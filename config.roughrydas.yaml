  league_id: 1851947
  team_id: 1
  season_id: 2026
  authorized_team: roughrydas
  read_only: false
league:
  teams: 10
  scoring: ppr            # 1.0/rec (statId 53 = 1.0)
  draft_type: snake
  draft_time: "2026-09-06T20:00:00-04:00"
  seconds_per_pick: 90
  draft_slot: 8           # pickOrder [8,11,5,3,10,4,7,1,2,6] -> team 1 is 8th
