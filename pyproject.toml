[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-draft-assistant"
version = "0.1.0"
description = "Fantasy football live draft recommendation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fantasy-draft = "fantasy_draft_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
