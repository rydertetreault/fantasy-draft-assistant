# Dad's Yahoo league: "Old Backs Fresh Minds" (384341), team 6 "All I Do Is Win"
# Confirmed 2026-08-29: 10-team HALF-PPR H2H snake, 60s/pick.
# Roster: QB/2RB/2WR/TE/W-R-T flex/K/DEF + 6 BN (+2 IR, not drafted).
league:
  teams: 10
  scoring: half_ppr
  roster_slots:
    QB: 1
    RB: 2
    WR: 2
    TE: 1
    FLEX: 1   # W/R/T
    DST: 1    # Yahoo "DEF"
    K: 1
    BENCH: 6
strategy:
  roster_need_weight: 8.0
  scarcity_weight: 6.0
  value_weight: 4.0
  bye_penalty_weight: 1.5
  # OWNER DIRECTIVE (mock #4, r2 Josh Allen graded B): follow the ESPN
  # profile formula — position round floors. QB added per owner: QBs are
  # never worth an early pick in a 10-team 1-QB league. K/DST BOTH at 14
  # (owner, post mock #5): "a really good kicker can help" — in the final
  # two rounds the engine orders K vs DEF by value (elite K first when the
  # DST tier is flat); endgame forcing guarantees both get filled.
  wait_until_round:
    QB: 5
    DST: 14
    K: 14
  # OWNER DIRECTIVE: "defense is based on when other teams start taking
  # theirs (deferrable)" — floors unlock EARLY only when the room has this
  # many hist-evidenced takes at the position (real scrape only; broken
  # scrape = safe deferral).
  reactive_floor_unlock:
    DST: 3
    K: 3
  # ESPN's floors are only a -30 base-funnel penalty — enough to bury K/DST
  # there, but the ctx layer re-sorts by wait-loss and ignores it (exactly
  # how Allen went r2). This makes floors HARD at the ctx layer. Yahoo-only.
  hard_wait_floors: true
  # OWNER DIRECTIVE (mock #4: RB,RB,RB before any WR — bad): dedicated
  # RB/WR/TE starter slots must be valued ahead of flex-stacking; a 3rd RB
  # while WR1/WR2 sit empty is bench depth, not a starter.
  fill_starters_before_flex: true
  # REQUIRED with hard floors: extends wait-loss modeling to
  # K/DST (else their wait_loss = full projection -> round-1 kicker bug,
  # mock #2). Yahoo-profile only; ESPN relies on its round floors instead.
  wait_loss_all_positions: true
  # K/DST always fall far past ESPN ADP (Aubrey 86.6 vs r14/15 reality) —
  # exempt them from the ADP ghost filter or the endgame blocks the best
  # K/DST at exactly the rounds we must draft them. Yahoo-profile only.
  adp_ghost_skill_only: true
  # OWNER DIRECTIVE: base picks on how the other teams have actually
  # picked. The driver scrapes the room's Picks tab; this flag parses that
  # scrape in true pick order for exact per-team snake attribution ->
  # opponent need / run / survival modeling on real picks. Yahoo-only;
  # ESPN keeps its validated legacy (full-name bag + ADP-order) path.
  history_order_attribution: true
  # ENDGAME FEASIBILITY (mock #5: 15 picks, ZERO K, ZERO DEF — DST gain
  # 4.87 missed the 5.0 filter-click gate): when rounds left <= empty
  # required lineup slots, candidates are restricted to those positions.
  force_required_slots_endgame: true
